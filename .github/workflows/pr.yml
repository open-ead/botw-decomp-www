name: pr
on: pull_request

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - name: install dependencies
      run: npm install
    - name: build
      run: npm run build
